<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/Caveat.ttf") format("truetype");
        font-weight: 400 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fdfcf8; }
      #root { position: relative; width: 100%; height: 100%; background: #fdfcf8; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cap {
        position: absolute; left: 0; right: 0; bottom: 18px; height: 80px;
        display: flex; justify-content: center; align-items: center; gap: 16px;
        font-family: "Caveat", cursive; font-weight: 700; font-size: 66px; color: #2a2a2a;
        opacity: 0; white-space: nowrap;
      }
      .cap span { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="marker" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
          </filter>
        </defs>
        <g id="board" filter="url(#marker)"></g>
      </svg>
      <div id="caps"></div>
      <audio id="vo" src="assets/voice.wav" data-start="0" data-duration="__TOTAL__" data-track-index="1" data-volume="1"></audio>
    </div>
