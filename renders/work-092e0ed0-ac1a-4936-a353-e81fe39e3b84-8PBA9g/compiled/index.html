      p.setAttribute("fill", op.fill);
      p.style.fillOpacity = 0;
      tl.to(p, { fillOpacity: op.fo === undefined ? 1 : op.fo, duration: 0.3 }, t + dur * 0.75);
    }
    return p;
  };
  // filled shape without outline, fades in
  S.fill = (d, t, dur, color, opacity = 1, parent) => {
    const p = el("path", { d, fill: color, stroke: "none" }, parent || g);
    tl.fromTo(p, { opacity: 0 }, { opacity, duration: Math.max(0.05, dur) }, t);
    return p;
  };
  // parts: [[d, weight, opts], ...] drawn one after another inside [t, t+dur]
  S.seq = (parts, t, dur, parent) => {
    const tot = parts.reduce((a, p) => a + (p[1] || 1), 0);
    let tt = t;
    return parts.map((p) => {
      const dd = (dur * (p[1] || 1)) / tot, op = Object.assign({ parent: parent || g }, p[2] || {});
      const e = S.draw(p[0], tt, dd, op);
      tt += dd;
      return e;
    });
  };
  // handwritten text, revealed left->right like a marker. size = font px. font: "ph" (Patrick Hand caps-friendly) | "caveat"
  S.text = (str, x, y, op = {}) => {
    const size = op.size || 64, t = op.t === undefined ? start : op.t, dur = op.dur === undefined ? Math.min(1.2, 0.05 * str.length + 0.25) : op.dur;
    const anchor = op.anchor || "middle", id = "tclip" + ++CLIPN;
    const cp = el("clipPath", { id }, defs);
    const wEst = str.length * size * (op.font === "caveat" ? 0.48 : 0.56) + size;
    const x0 = anchor === "middle" ? x - wEst / 2 : anchor === "end" ? x - wEst : x - size * 0.2;
    const r = el("rect", { x: x0, y: y - size * 1.15, width: 0, height: size * 1.6 }, cp);
    const te = el("text", { x, y, "text-anchor": anchor, "font-family": op.font === "caveat" ? "Caveat" : "PH", "font-size": size, fill: op.c || INK, "clip-path": `url(#${id})` }, op.parent || g);
    if (op.weight) te.setAttribute("font-weight", op.weight);
    if (op.spacing) te.setAttribute("letter-spacing", op.spacing);
    te.textContent = str;
    tl.fromTo(r, { attr: { width: 0 } }, { attr: { width: wEst }, duration: dur, ease: "none" }, t);
    return te;
  };
  S.fadeIn = (e, t, dur = 0.3) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: dur }, t);
  S.fadeOut = (e, t, dur = 0.3) => tl.to(e, { opacity: 0, duration: dur }, t);
  S.show = (e, t) => tl.set(e, { opacity: 1 }, t);
  S.hide = (e, t) => tl.set(e, { opacity: 0 }, t);
  S.move = (e, t, dur, props, ease = "power2.inOut") => tl.to(e, Object.assign({ duration: dur, ease }, props), t);
  S.pop = (e, t, cx, cy, dur = 0.35) => tl.fromTo(e, { scale: 0.001 }, { scale: 1, svgOrigin: `${cx} ${cy}`, duration: dur, ease: "back.out(2)" }, t);
  S.tilt = (deg, t, dur = 0.3) => tl.to(g, { rotation: deg, svgOrigin: "960 540", duration: dur, ease: "power2.out" }, t);
  S.fig = (...a) => fig(S, ...a);
  for (const k in PROPS) S[k] = (...a) => PROPS[k](S, ...a);
  return S;
}

// ---------- stick figure ----------
const POSES = {
  stand: [[[-28, 52], [-48, 100]], [[28, 52], [48, 100]]],
  sad: [[[-18, 55], [-26, 106]], [[18, 55], [26, 106]]],
  point: [[[-28, 52], [-48, 100]], [[70, -5], [140, -30]]],
  pointL: [[[-70, -5], [-140, -30]], [[28, 52], [48, 100]]],
  armsUp: [[[-35, -20], [-62, -82]], [[35, -20], [62, -82]]],
  shrug: [[[-45, 5], [-90, -50]], [[45, 5], [90, -50]]],
  think: [[[-28, 52], [-48, 100]], [[48, 35], [14, -8]]],
  hips: [[[-46, 45], [-12, 96]], [[46, 45], [12, 96]]],
  wave: [[[-28, 52], [-48, 100]], [[58, -18], [78, -92]]],
  cross: [[[32, 48], [-38, 58]], [[-32, 48], [38, 58]]],
  head: [[[-58, -12], [-34, -64]], [[58, -12], [34, -64]]],
  reach: [[[-28, 52], [-48, 100]], [[62, 10], [134, 8]]],
  reachL: [[[-62, 10], [-134, 8]], [[28, 52], [48, 100]]],
  hold: [[[-30, 50], [-8, 82]], [[30, 50], [10, 80]]], // both hands together in front (holding phone/book)
  push: [[[-28, 52], [-48, 100]], [[90, 10], [170, 2]]],
};
// fig(S, cx, groundY, {s, pose, armL, armR, legL, legR, sit, c, parent, face})
function fig(S, cx, gy, o = {}) {
  const s = o.s || 1, sit = !!o.sit, col = o.c || INK;
  const g = el("g", {}, o.parent || S.g), gi = el("g", {}, g);
  const hip = [cx, gy - (sit ? 10 : 130) * s], sh = [cx, hip[1] - 125 * s], hd = [cx, sh[1] - 45 * s], r = 42 * s;
  const pp = (base, pts) => poly([base, ...pts.map((p) => [base[0] + p[0] * s, base[1] + p[1] * s])], 2);
  const sw = o.w || 7 * Math.max(s, 0.85);
  const mk = (d, hidden) => {
    const p = el("path", { d, pathLength: 1, fill: "none", stroke: col, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "1 2", "stroke-dashoffset": hidden ? 0 : 1 }, gi);
    if (hidden) p.style.opacity = 0;
    return p;
  };
  const pose = POSES[o.pose || "stand"];
  const legsDef = sit ? [[[70, -5], [75, 128]], [[95, 10], [100, 128]]] : [[[-8, 62], [-35, 130]], [[8, 62], [35, 130]]];
  const P = {
    head: mk(circ(hd[0], hd[1], r)),
    body: mk(line([hd[0], hd[1] + r], hip)),
    armL: mk(pp(sh, o.armL || pose[0])),
    armR: mk(pp(sh, o.armR || pose[1])),
    legL: mk(pp(hip, o.legL || legsDef[0])),
    legR: mk(pp(hip, o.legR || legsDef[1])),
  };
  const F = { g, gi, P, s, cx, gy, sh, hip, hd, r, arms: [P.armL, P.armR], faceG: null };
  F.hand = (side = "R", poseName) => {
    const ps = poseName ? POSES[poseName] : [o.armL || pose[0], o.armR || pose[1]];
    const last = (side === "L" ? ps[0] : ps[1]).slice(-1)[0];
    return [sh[0] + last[0] * s, sh[1] + last[1] * s];
  };
  F.top = () => [cx, hd[1] - r];
  F.draw = (t, dur) => {
    const seq = [["head", 0.26], ["body", 0.18], ["armL", 0.14], ["armR", 0.14], ["legL", 0.14], ["legR", 0.14]];
    let tt = t;
    seq.forEach(([k, w]) => {
      tl.fromTo(P[k], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: Math.max(0.02, w * dur), ease: "none" }, tt);
      tt += w * dur;
    });
    return F;
  };
  F.instant = (t) => { Object.values(P).forEach((p) => tl.set(p, { strokeDashoffset: 0 }, t)); return F; };
  // switch arms to a named pose (or custom [armL, armR]) at time t — instant swap reads as a gesture
  F.setPose = (t, name, custom) => {
    const ps = custom || POSES[name];
    const nl = mk(pp(sh, ps[0]), true), nr = mk(pp(sh, ps[1]), true);
    tl.set(F.arms, { opacity: 0 }, t);
    tl.set([nl, nr], { opacity: 1 }, t);
    F.arms = [nl, nr];
    return F;
  };
  // faces: smile | happy | sad | flat | wow | worried | sleep | determined. dx shifts gaze.
  F.face = (t, kind = "smile", dx = 0) => {
    const fg = el("g", {}, gi);
    if (F.faceG) tl.set(F.faceG, { opacity: 0 }, t);
    F.faceG = fg;
    const X = (v) => hd[0] + (v + dx) * s, Y = (v) => hd[1] + v * s;
    const dr = (d, w, fill) => S.draw(d, t, 0.15, { parent: fg, w: w * s, c: col, fill });
    if (kind === "sleep") { dr(arc(X(-15), Y(-6), 7, 20, 160), 4); dr(arc(X(15), Y(-6), 7, 20, 160), 4); }
    else { dr(circ(X(-15), Y(-6), 4.5), 5, col); dr(circ(X(15), Y(-6), 4.5), 5, col); }
    const m = {
      smile: [[-14, 13], [0, 23], [14, 13]], happy: [[-17, 10], [0, 27], [17, 10]], sad: [[-14, 24], [0, 14], [14, 24]],
      flat: [[-12, 19], [12, 19]], worried: [[-14, 21], [-5, 16], [5, 22], [14, 17]], determined: [[-12, 18], [12, 16]], sleep: [[-6, 18], [6, 18]],
    }[kind];
    if (kind === "wow") dr(circ(X(0), Y(18), 6, 8), 4);
    else dr(smooth(m.map((p) => [X(p[0]), Y(p[1])])), 5);
    if (kind === "determined" || kind === "worried") {
      const k = kind === "determined" ? 1 : -1;
      dr(line([X(-24), Y(-18 - 4 * k)], [X(-7), Y(-15 + 3 * k)], 1), 4);
      dr(line([X(24), Y(-18 - 4 * k)], [X(7), Y(-15 + 3 * k)], 1), 4);
    }
    return fg;
  };
  const pair = (a, b) => [mk(pp(hip, a), true), mk(pp(hip, b), true)];
  const WS = [pair([[8, 64], [-50, 124]], [[-4, 66], [34, 132]]), pair([[0, 66], [-10, 132]], [[0, 66], [10, 132]]), pair([[-4, 66], [34, 132]], [[8, 64], [-50, 124]])];
  const orig = [P.legL, P.legR];
  const showSet = (t, k) => { tl.set([...orig, ...WS.flat()], { opacity: 0 }, t); tl.set(k < 0 ? orig : WS[k], { opacity: 1 }, t); };
  // walk: translate outer group by props ({x, y}) with a leg cycle
  F.walk = (t0, dur, props, stepLen = 0.2) => {
    tl.to(g, Object.assign({ duration: dur, ease: "none" }, props), t0);
    const n = Math.floor(dur / stepLen), q = [0, 1, 2, 1];
    for (let i = 0; i < n; i++) showSet(t0 + i * stepLen, q[i % 4]);
    showSet(t0 + dur, -1);
    return F;
  };
  F.lie = (t, dur = 0.35, deg = 88) => (tl.to(gi, { rotation: deg, svgOrigin: `${cx} ${gy}`, duration: dur, ease: "power2.in" }, t), F);
  F.rise = (t, dur = 0.6) => (tl.to(gi, { rotation: 0, svgOrigin: `${cx} ${gy}`, duration: dur, ease: "power2.out" }, t), F);
  F.grow = (t, dur, k) => (tl.to(gi, { scale: k, svgOrigin: `${cx} ${gy}`, duration: dur, ease: "power2.inOut" }, t), F);
  F.slump = (t, dur = 0.4, deg = 10) => (tl.to(gi, { rotation: deg, svgOrigin: `${cx} ${hip[1]}`, duration: dur }, t), F);
  if (o.face) F.face(o.faceT === undefined ? S.start : o.faceT, o.face);
  return F;
}

// ---------- props: every prop(S, ..., t, dur, o) draws inside [t, t+dur] and returns {g, ...} ----------
const PROPS = {
  // phone centred at (x,y); o.screen: play|chat|feed|heart|blank ; o.glow adds light rays
  phone(S, x, y, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent), w = 74 * s, h = 136 * s;
    const parts = [
      [rrect(x - w / 2, y - h / 2, w, h, 12 * s), 3, { w: 6, fill: PAPER }],
      [rrect(x - w / 2 + 8 * s, y - h / 2 + 15 * s, w - 16 * s, h - 34 * s, 4 * s), 2, { w: 4, fill: o.glow ? GLOW : SKY }],
      [line([x - 10 * s, y + h / 2 - 9 * s], [x + 10 * s, y + h / 2 - 9 * s], 1), 0.4, { w: 4 }],
    ];
    const sc = o.screen || "blank";
    if (sc === "play") parts.push([poly([[x - 9 * s, y - 16 * s], [x + 15 * s, y - 2 * s], [x - 9 * s, y + 12 * s], [x - 9 * s, y - 16 * s]], 1), 1, { w: 4, fill: RED }]);
    if (sc === "chat") { parts.push([rrect(x - 24 * s, y - 32 * s, 32 * s, 16 * s, 5 * s), 0.6, { w: 3 }]); parts.push([rrect(x - 6 * s, y - 6 * s, 30 * s, 16 * s, 5 * s), 0.6, { w: 3, fill: GREEN }]); }
    if (sc === "feed") [-30, -10, 10, 30].forEach((dy) => parts.push([line([x - 22 * s, y + dy * s], [x + 20 * s, y + dy * s], 1), 0.3, { w: 3 }]));
    if (sc === "heart") parts.push([heartPath(x, y - 6 * s, 0.55 * s), 1, { w: 3, fill: RED }]);
    S.seq(parts, t, dur * (o.glow ? 0.8 : 1), g);
    if (o.glow) S.draw(rays(x, y, h * 0.62, h * 0.82, 9), t + dur * 0.8, dur * 0.2, { w: 5, parent: g, c: DARK ? GLOW : ORANGE });
    return { g };
  },
  laptop(S, x, y, s = 1, t, dur, o = {}) { // (x,y) = centre of the keyboard edge
    const g = S.grp(o.parent);
    S.seq([
      [poly([[x - 115 * s, y], [x - 92 * s, y - 150 * s], [x + 100 * s, y - 150 * s], [x + 82 * s, y], [x - 115 * s, y]], 2), 3, { w: 6, fill: SKY }],
      [line([x - 140 * s, y], [x + 120 * s, y], 2), 1, { w: 9 }],
      ...(o.lines === false ? [] : [[line([x - 75 * s, y - 110 * s], [x + 60 * s, y - 110 * s], 1) + line([x - 80 * s, y - 80 * s], [x + 40 * s, y - 80 * s], 1) + line([x - 85 * s, y - 50 * s], [x + 10 * s, y - 50 * s], 1), 1.5, { w: 3.5 }]]),
    ], t, dur, g);
    return { g };
  },
  bed(S, x, y, w = 420, t, dur, o = {}) { // x = left, y = floor
    const g = S.grp(o.parent);
    S.seq([
      [rect(x, y - 200, 26, 200), 1.2, { w: 6 }],
      [rect(x + 26, y - 110, w - 26, 50), 2, { w: 6, fill: CREAM }],
      [line([x + w - 6, y - 60], [x + w - 6, y], 1), 0.4, { w: 6 }],
      [smooth([[x + 40, y - 112], [x + 50, y - 150], [x + 110, y - 152], [x + 118, y - 114]]), 0.8, { w: 5, fill: PAPER }],
      ...(o.blanket === false ? [] : [[smooth([[x + 130, y - 108], [x + 180, y - 140], [x + 300, y - 132], [x + w - 10, y - 116]]), 1.2, { w: 5 }]]),
    ], t, dur, g);
    return { g };
  },
  // analog clock; o.h (0-12), o.m (0-59), o.bells (alarm clock). returns {hourG, minG} for spinning
  clock(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent);
    const ha = (((o.h || 0) % 12) + (o.m || 0) / 60) * 30 - 90, ma = (o.m || 0) * 6 - 90, rad = (a) => (a * Math.PI) / 180;
    const parts = [[circ(cx, cy, r), 3, { w: Math.max(6, r / 22), fill: PAPER }], [rays(cx, cy, r * 0.82, r * 0.94, 12, -Math.PI / 2), 1.5, { w: 5 }]];
    if (o.bells) parts.unshift([circ(cx - r * 0.62, cy - r * 1.05, r * 0.24, r * 0.15) + circ(cx + r * 0.62, cy - r * 1.05, r * 0.24, r * 0.15), 1, { w: 6 }], [line([cx - r * 0.6, cy + r * 0.95], [cx - r * 0.8, cy + r * 1.25], 1) + line([cx + r * 0.6, cy + r * 0.95], [cx + r * 0.8, cy + r * 1.25], 1), 0.6, { w: 6 }]);
    S.seq(parts, t, dur * 0.75, g);
    const hourG = S.grp(g), minG = S.grp(g); // created AFTER the face so the paper fill does not cover the hands
    S.draw(line([cx, cy], [cx + Math.cos(rad(ma)) * r * 0.75, cy + Math.sin(rad(ma)) * r * 0.75], 1), t + dur * 0.75, dur * 0.1, { w: Math.max(6, r / 26), parent: minG });
    S.draw(line([cx, cy], [cx + Math.cos(rad(ha)) * r * 0.45, cy + Math.sin(rad(ha)) * r * 0.45], 1), t + dur * 0.85, dur * 0.1, { w: Math.max(8, r / 18), parent: hourG });
    S.draw(circ(cx, cy, Math.max(6, r * 0.05)), t + dur * 0.95, dur * 0.05, { w: 5, fill: INK, parent: g });
    return { g, hourG, minG, spin: (t0, d, turns = 3) => { tl.to(minG, { rotation: 360 * turns, svgOrigin: `${cx} ${cy}`, duration: d, ease: "power1.in" }, t0); tl.to(hourG, { rotation: 30 * turns, svgOrigin: `${cx} ${cy}`, duration: d, ease: "power1.in" }, t0); } };
  },
  // digital clock box with red text, e.g. "2:00 AM"
  digital(S, x, y, txt, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent), w = 60 + txt.length * 30 * s, h = 90 * s;
    S.draw(rrect(x - w / 2, y - h / 2, w, h, 12 * s), t, dur * 0.4, { w: 6, parent: g, fill: DARK ? "#111" : "#20232a" });
    S.text(txt, x, y + 20 * s, { size: 64 * s, c: RED, t: t + dur * 0.45, dur: dur * 0.5, parent: g });
    return { g };
  },
  // calendar page; returns cells [[cx,cy],...] row-major
  calendar(S, x, y, cols, rows, cw, ch, t, dur, o = {}) {
    const g = S.grp(o.parent), W0 = cols * cw, H0 = rows * ch, head = 70;
    let grid = "";
    for (let k = 1; k < cols; k++) grid += poly([[x + cw * k, y + head], [x + cw * k, y + head + H0]], 1);
    for (let k = 1; k < rows; k++) grid += poly([[x, y + head + ch * k], [x + W0, y + head + ch * k]], 1);
    S.seq([[rect(x, y, W0, head + H0), 3, { w: 7, fill: PAPER }], [poly([[x, y + head], [x + W0, y + head]], 1), 0.6, { w: 6 }], [circ(x + W0 * 0.18, y, 12) + circ(x + W0 * 0.82, y, 12), 0.5, { w: 6 }], [grid, 2, { w: 3.5 }]], t, dur, g);
    if (o.title) S.text(o.title, x + W0 / 2, y + head - 18, { size: 44, t: t + dur * 0.5, dur: dur * 0.4, parent: g });
    const cells = [];
    for (let rr = 0; rr < rows; rr++) for (let cc = 0; cc < cols; cc++) cells.push([x + cw * cc + cw / 2, y + head + ch * rr + ch / 2]);
    return { g, cells };
  },
  tick(S, x, y, s = 1, t, dur = 0.15, o = {}) { return { g: S.draw(smooth([[x - 22 * s, y], [x - 6 * s, y + 18 * s], [x + 26 * s, y - 24 * s]]), t, dur, { c: o.c || GREEN, w: o.w || 9, parent: o.parent }) }; },
  cross(S, x, y, s = 1, t, dur = 0.25, o = {}) {
    const g = S.grp(o.parent), r = 40 * s;
    S.draw(line([x - r, y - r], [x + r, y + r], 3), t, dur / 2, { c: o.c || RED, w: o.w || 12, parent: g });
    S.draw(line([x + r, y - r], [x - r, y + r], 3), t + dur / 2, dur / 2, { c: o.c || RED, w: o.w || 12, parent: g });
    return { g };
  },
  // big red X across a box
  strike(S, x1, y1, x2, y2, t, dur = 0.4, o = {}) {
    const g = S.grp(o.parent);
    S.draw(line([x1, y1], [x2, y2], 4), t, dur / 2, { c: o.c || RED, w: o.w || 15, parent: g });
    S.draw(line([x2, y1], [x1, y2], 4), t + dur / 2, dur / 2, { c: o.c || RED, w: o.w || 15, parent: g });
    return { g };
  },
  cloud(S, cx, cy, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent), pts = [];
    const bumps = [[-1, 0.25], [-0.85, -0.25], [-0.45, -0.5], [0, -0.62], [0.45, -0.45], [0.85, -0.2], [1, 0.25], [0.5, 0.42], [0, 0.4], [-0.5, 0.42], [-1, 0.25]];
    bumps.forEach((b) => pts.push([cx + b[0] * 150 * s, cy + b[1] * 110 * s]));
    S.draw(smooth(pts), t, dur * (o.storm ? 0.7 : 1), { w: 7, parent: g, fill: o.fill || (o.storm ? (DARK ? "#4a4d55" : "#cfd4dc") : PAPER) });
    if (o.storm) S.draw(poly([[cx + 10 * s, cy + 40 * s], [cx - 25 * s, cy + 105 * s], [cx + 5 * s, cy + 105 * s], [cx - 20 * s, cy + 165 * s]], 1), t + dur * 0.72, dur * 0.28, { w: 7, c: YEL, parent: g });
    return { g };
  },
  rain(S, cx, cy, w, n, t, dur, o = {}) {
    const g = S.grp(o.parent);
    for (let i = 0; i < n; i++) { const x = cx - w / 2 + (i * w) / Math.max(1, n - 1), y = cy + (i % 3) * 18; S.draw(poly([[x, y], [x - 12, y + 38]], 1), t + (i * dur * 0.7) / n, dur * 0.3, { w: 5, c: BLUE, parent: g }); }
    return { g };
  },
  sun(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent);
    S.draw(circ(cx, cy, r), t, dur * 0.55, { w: 7, fill: YEL, parent: g });
    S.draw(rays(cx, cy, r * 1.3, r * 1.75, 10, 0), t + dur * 0.55, dur * 0.45, { w: 6, parent: g });
    return { g };
  },
  moon(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent);
    const outer = arcPts(cx, cy, r, -60, 240), inner = arcPts(cx + r * 0.45, cy - r * 0.2, r * 0.85, 228, -48).slice(1);
    S.draw(smooth([...outer, ...inner, outer[0]]), t, dur, { w: 6, fill: GLOW, parent: g });
    return { g };
  },
  stars(S, n, x0, y0, x1, y1, t, dur, o = {}) {
    const g = S.grp(o.parent);
    for (let i = 0; i < n; i++) { const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0), r = 7 + rnd() * 8; S.draw(`M${f1(x - r)} ${f1(y)} L${f1(x + r)} ${f1(y)} M${f1(x)} ${f1(y - r)} L${f1(x)} ${f1(y + r)}`, t + (i * dur) / n, dur / n, { w: 4, c: o.c || (DARK ? GLOW : GRAY), parent: g }); }
    return { g };

      [line([cx - 74 * s, top], [cx + 74 * s, top], 1), 0.5, { w: 7 }],
      [smooth([[cx - 70 * s, top + 22 * s], [cx - 115 * s, top + 26 * s], [cx - 105 * s, top + 80 * s], [cx - 55 * s, top + 82 * s]]) + smooth([[cx + 70 * s, top + 22 * s], [cx + 115 * s, top + 26 * s], [cx + 105 * s, top + 80 * s], [cx + 55 * s, top + 82 * s]]), 1.2, { w: 5 }],
      [poly([[cx, top + 135 * s], [cx, y - 28 * s], [cx - 38 * s, y], [cx + 38 * s, y], [cx, y - 28 * s]], 1), 1, { w: 6 }],
    ], t, dur, g);
    return { g };
  },
  pedestal(S, x, y, w, h, t, dur, o = {}) { // x left, y floor
    const g = S.grp(o.parent);
    S.draw(rect(x, y - h, w, h), t, dur * (o.label ? 0.7 : 1), { w: 7, fill: CREAM, parent: g });
    if (o.label) S.text(o.label, x + w / 2, y - h / 2 + 16, { size: Math.min(48, h * 0.6), t: t + dur * 0.7, dur: dur * 0.3, parent: g });
    return { g };
  },
  plant(S, x, y, s = 1, t, dur, o = {}) { // pot base centre (x,y)
    const g = S.grp(o.parent);
    S.seq([
      [poly([[x - 40 * s, y], [x - 50 * s, y - 60 * s], [x + 50 * s, y - 60 * s], [x + 40 * s, y], [x - 40 * s, y]], 1), 1, { w: 6, fill: "#e8b98d" }],
      [smooth([[x, y - 60 * s], [x - 3 * s, y - 110 * s], [x + 5 * s, y - 165 * s], [x, y - 210 * s]]), 1.5, { w: 7, c: GREEN }],
      [smooth([[x - 2 * s, y - 120 * s], [x - 50 * s, y - 135 * s], [x - 70 * s, y - 185 * s], [x - 25 * s, y - 165 * s], [x - 2 * s, y - 120 * s]]), 1, { w: 6, c: GREEN, fill: LEAF }],
      [smooth([[x + 2 * s, y - 165 * s], [x + 50 * s, y - 185 * s], [x + 70 * s, y - 235 * s], [x + 25 * s, y - 215 * s], [x + 2 * s, y - 165 * s]]), 1, { w: 6, c: GREEN, fill: LEAF }],
    ], t, dur, g);
    return { g };
  },
  book(S, cx, cy, s = 1, t, dur, o = {}) { // open book centred
    const g = S.grp(o.parent), k = s;
    S.seq([
      [poly([[cx - 240 * k, cy - 70 * k], [cx, cy - 35 * k], [cx, cy + 100 * k], [cx - 240 * k, cy + 65 * k], [cx - 240 * k, cy - 70 * k]], 2), 2, { w: 7, fill: CREAM }],
      [poly([[cx, cy - 35 * k], [cx + 240 * k, cy - 70 * k], [cx + 240 * k, cy + 65 * k], [cx, cy + 100 * k]], 2), 2, { w: 7, fill: CREAM }],
      [[-1, 1].map((sd) => [0, 1, 2].map((i) => poly([[cx + sd * 35 * k, cy - 12 * k + i * 32 * k], [cx + sd * 205 * k, cy - 34 * k + i * 32 * k]], 1)).join("")).join(""), 2, { w: 3.5 }],
    ], t, dur, g);
    return { g };
  },
  underline(S, x1, x2, y, t, dur, o = {}) { return { g: S.draw(poly([[x1, y], [(x1 + x2) / 2, y + 6], [x2, y - 3]], 2), t, dur, { w: o.w || 12, c: o.c || INK, parent: o.parent }) }; },
  // circle highlight around something
  ring(S, cx, cy, rx, ry, t, dur, o = {}) { return { g: S.draw(circ(cx, cy, rx, ry), t, dur, { w: o.w || 7, c: o.c || RED, parent: o.parent }) }; },
  // n small people in a row; o.hi = indices drawn in colour o.hiC; returns figs
  crowd(S, n, x0, gy, gap, s, t, dur, o = {}) {
    const figs = [];
    for (let i = 0; i < n; i++) {
      const hi = (o.hi || []).includes(i);
      const F = fig(S, x0 + i * gap, gy, { s, c: hi ? o.hiC || RED : o.c || INK, parent: o.parent, pose: o.pose });
      F.draw(t + (i * dur * 0.5) / n, dur * 0.5);
      if (o.face) F.face(t + dur * 0.9, hi && o.hiFace ? o.hiFace : o.face);
      figs.push(F);
    }
    return figs;
  },
  hamsterWheel(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent), wheel = S.grp(g);
    S.draw(circ(cx, cy, r), t, dur * 0.5, { w: 8, parent: wheel });
    S.draw(rays(cx, cy, 8, r, 8, 0), t + dur * 0.5, dur * 0.25, { w: 4, parent: wheel });
    S.draw(poly([[cx, cy], [cx - r * 0.55, cy + r * 1.25]], 1) + poly([[cx, cy], [cx + r * 0.55, cy + r * 1.25]], 1) + poly([[cx - r * 0.75, cy + r * 1.25], [cx + r * 0.75, cy + r * 1.25]], 1), t + dur * 0.75, dur * 0.25, { w: 7, parent: g });
    return { g, wheel, spin: (t0, d, turns = 2) => tl.to(wheel, { rotation: 360 * turns, svgOrigin: `${cx} ${cy}`, duration: d, ease: "none" }, t0) };
  },
  flame(S, cx, cy, s = 1, t, dur, o = {}) { // cy = base
    const g = S.grp(o.parent);
    S.draw(smooth([[cx - 40 * s, cy], [cx - 55 * s, cy - 60 * s], [cx - 15 * s, cy - 110 * s], [cx, cy - 160 * s], [cx + 10 * s, cy - 100 * s], [cx + 45 * s, cy - 80 * s], [cx + 42 * s, cy - 20 * s], [cx, cy + 2 * s], [cx - 40 * s, cy]]), t, dur * 0.7, { w: 6, fill: ORANGE, parent: g });
    S.draw(smooth([[cx - 15 * s, cy - 5 * s], [cx - 22 * s, cy - 40 * s], [cx, cy - 75 * s], [cx + 18 * s, cy - 35 * s], [cx + 10 * s, cy - 5 * s]]), t + dur * 0.7, dur * 0.3, { w: 4, fill: YEL, parent: g });
    return { g };
  },
  drop(S, cx, cy, s = 1, t, dur = 0.2, o = {}) { return { g: S.draw(smooth([[cx, cy - 22 * s], [cx - 10 * s, cy], [cx - 9 * s, cy + 10 * s], [cx, cy + 15 * s], [cx + 9 * s, cy + 10 * s], [cx + 10 * s, cy], [cx, cy - 22 * s]]), t, dur, { w: 4, c: BLUE, fill: o.fill || SKY, parent: o.parent }) }; },
  bolt(S, cx, cy, s = 1, t, dur = 0.25, o = {}) { return { g: S.draw(poly([[cx + 20 * s, cy - 70 * s], [cx - 25 * s, cy + 5 * s], [cx + 8 * s, cy + 5 * s], [cx - 18 * s, cy + 75 * s], [cx + 32 * s, cy - 10 * s], [cx, cy - 10 * s], [cx + 20 * s, cy - 70 * s]], 1), t, dur, { w: 5, fill: YEL, parent: o.parent }) }; },
  zzz(S, x, y, t, dur, o = {}) { const g = S.grp(o.parent); ["z", "z", "Z"].forEach((z, i) => S.text(z, x + i * 30, y - i * 34, { size: 40 + i * 12, t: t + (i * dur) / 3, dur: dur / 3, parent: g, c: o.c || INK })); return { g }; },
  // theatre seats row
  seats(S, x0, y, n, gap, t, dur, o = {}) {
    const g = S.grp(o.parent);
    let d = "";
    for (let i = 0; i < n; i++) { const x = x0 + i * gap; d += rrect(x, y - 110, gap * 0.8, 70, 14) + rect(x - 4, y - 46, gap * 0.8 + 8, 30); }
    S.draw(d, t, dur, { w: 5, parent: g, fill: o.fill || (DARK ? "#5a2f33" : "#e8a3a3") });
    return { g };
  },
  // graduation cap (o.kind:"grad") or Napoleon bicorne ("bicorne") centred at (cx,cy)
  hat(S, cx, cy, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent);
    if ((o.kind || "grad") === "grad") S.seq([[poly([[cx - 70 * s, cy], [cx, cy - 30 * s], [cx + 70 * s, cy], [cx, cy + 30 * s], [cx - 70 * s, cy]], 1), 2, { w: 6, fill: INK }], [rect(cx - 36 * s, cy + 10 * s, 72 * s, 30 * s), 1, { w: 6, fill: INK }], [smooth([[cx, cy], [cx + 50 * s, cy + 12 * s], [cx + 58 * s, cy + 52 * s]]), 0.6, { w: 4, c: YEL }]], t, dur, g);
    else S.seq([[smooth([[cx - 95 * s, cy + 20 * s], [cx - 60 * s, cy - 30 * s], [cx, cy - 55 * s], [cx + 60 * s, cy - 30 * s], [cx + 95 * s, cy + 20 * s], [cx, cy + 8 * s], [cx - 95 * s, cy + 20 * s]]), 2, { w: 6, fill: INK }], [circ(cx, cy - 22 * s, 11 * s), 0.6, { w: 4, fill: RED }]], t, dur, g);
    return { g };
  },
  // name tag / label box with text
  tag(S, cx, cy, txt, t, dur, o = {}) {
    const g = S.grp(o.parent), size = o.size || 40, w = txt.length * size * 0.55 + 40, h = size * 1.4;
    S.draw(rrect(cx - w / 2, cy - h / 2, w, h, 10), t, dur * 0.4, { w: 5, fill: o.fill || PAPER, parent: g, c: o.c || INK });
    S.text(txt, cx, cy + size * 0.35, { size, t: t + dur * 0.4, dur: dur * 0.6, parent: g, c: o.tc || INK });
    return { g };
  },
  // checklist: items [text,...] from (x,y) downwards; returns box centres
  checklist(S, x, y, items, t, dur, o = {}) {
    const g = S.grp(o.parent), gap = o.gap || 78, size = o.size || 48, boxes = [];
    items.forEach((txt, i) => {
      const yy = y + i * gap, tt = t + (i * dur) / items.length, d = dur / items.length;
      S.draw(rect(x, yy - 24, 46, 46), tt, d * 0.35, { w: 6, parent: g });
      S.text(txt, x + 70, yy + 16, { size, anchor: "start", t: tt + d * 0.35, dur: d * 0.6, parent: g });
      boxes.push([x + 23, yy]);
    });
    return { g, boxes };
  },
  // glowing rays burst
  burst(S, cx, cy, r1, r2, n, t, dur, o = {}) { return { g: S.draw(rays(cx, cy, r1, r2, n, o.a0 || 0, o.span || Math.PI * 2), t, dur, { w: o.w || 6, c: o.c || INK, parent: o.parent }) }; },
};

// ---------- captions (bottom line, word-by-word reveal) ----------
function captions(CH) {
  const capsEl = document.getElementById("caps");
  CH.forEach((ch, i) => {
    const ws = ch.slice(0, -1), clipEnd = ch[ch.length - 1];
    const d = document.createElement("div");
    d.className = "cap";
    ws.forEach((w) => {
      const sp = document.createElement("span");
      sp.textContent = w[0];
      d.appendChild(sp);
      tl.to(sp, { opacity: 1, duration: 0.08 }, w[1]);
    });
    capsEl.appendChild(d);
    const t0 = ws[0][1] - 0.05, nxt = CH[i + 1];
    const t1 = nxt && nxt[0][1] - ws[ws.length - 1][2] < 1.2 ? nxt[0][1] - 0.05 : clipEnd + 0.4;
    tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
    tl.to(d, { opacity: 0, duration: 0.2 }, Math.min(t1, TOTAL) - 0.2);
  });
}
