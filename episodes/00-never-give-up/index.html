<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Caveat";
        src: url("assets/fonts/Caveat.ttf") format("truetype");
        font-weight: 400 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fdfcf8; }
      #root { position: relative; width: 100%; height: 100%; background: #fdfcf8; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cap {
        position: absolute; left: 0; right: 0; bottom: 18px; height: 80px;
        display: flex; justify-content: center; align-items: center; gap: 16px;
        font-family: "Caveat", cursive; font-weight: 700; font-size: 66px; color: #2a2a2a;
        opacity: 0; white-space: nowrap;
      }
      .cap span { opacity: 0; }
      #big { position: absolute; left: 110px; top: 50px; font-family: "Caveat", cursive; font-weight: 700; font-size: 150px; color: #161616; opacity: 0; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="70.88" data-width="1920" data-height="1080">
      <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="marker" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
          </filter>
        </defs>
        <g id="board" filter="url(#marker)"></g>
      </svg>
      <div id="caps"></div>
      <div id="big">Never give up.</div>
      <audio id="vo" src="assets/voice.wav" data-start="0" data-duration="70.88" data-track-index="1" data-volume="1"></audio>
    </div>
    
    <script>
      
      const NS = "http://www.w3.org/2000/svg";
      const INK = "#161616", RED = "#e0312b", GREEN = "#3f9e4a", LEAF = "#a8dca8", YEL = "#ffd23f", SKY = "#d9ecff", PINK = "#ffd9df";
      const GY = 860;
      const tl = gsap.timeline({ paused: true });
      const board = document.getElementById("board");
      const CS = 25.8, CE = 34.42;
      const OLDA = [0, 4.0, 8.2, 12.6, 17.0, 21.8, 27.2, 32.2, 40.2, 40.25, 46.2, 51.2, 56.4, 57.13, 58.52, 60.09, 63.6, 64.3, 65.89, 68.0, 69.41, 70.8, 71.0, 72.4, 76], NEWA = [0, 3.66, 6.14, 9.4, 12.29, 15.33, 17.67, 20.84, 25.8, 34.42, 37.75, 40.65, 44.06, 44.459, 46.838, 48.954, 50.11, 51.213, 54.062, 55.652, 57.942, 61.625, 62.925, 65.535, 70.88];
      const m = (t) => {
        if (t <= OLDA[0]) return NEWA[0] + (t - OLDA[0]);
        for (let i = 1; i < OLDA.length; i++) if (t <= OLDA[i]) return NEWA[i - 1] + ((t - OLDA[i - 1]) / (OLDA[i] - OLDA[i - 1])) * (NEWA[i] - NEWA[i - 1]);
        return NEWA[NEWA.length - 1] + (t - OLDA[OLDA.length - 1]);
      };
      const makeTL = (mf) => ({
        to: (t, v, p) => { const a = mf(p), e = mf(p + (v.duration || 0)); return tl.to(t, { ...v, duration: Math.max(0.001, e - a) }, a); },
        fromTo: (t, f, v, p) => { const a = mf(p), e = mf(p + (v.duration || 0)); return tl.fromTo(t, f, { ...v, duration: Math.max(0.001, e - a) }, a); },
        set: (t, v, p) => tl.set(t, v, mf(p)),
      });
      const TL = makeTL(m), IDTL = makeTL((t) => t);


      // ---------- deterministic hand-drawn helpers ----------
      let seed = 11;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const J = (a) => (rnd() - 0.5) * a;
      const f1 = (n) => n.toFixed(1);
      const el = (tag, attrs, parent) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        parent.appendChild(e);
        return e;
      };
      const poly = (pts, jit = 3) => pts.map((p, i) => `${i ? "L" : "M"}${f1(p[0] + J(jit))} ${f1(p[1] + J(jit))}`).join(" ");
      const line = (a, b) => {
        const mx = (a[0] + b[0]) / 2 + J(8), my = (a[1] + b[1]) / 2 + J(8);
        return `M${f1(a[0] + J(3))} ${f1(a[1] + J(3))} Q${f1(mx)} ${f1(my)} ${f1(b[0] + J(3))} ${f1(b[1] + J(3))}`;
      };
      const smooth = (pts) => {
        let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
          d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
        }
        return d;
      };
      const circ = (cx, cy, r, ry = r) => {
        const n = 16, a0 = rnd() * 6.28, pts = [];
        for (let i = 0; i <= n + 1; i++) {
          const a = a0 + (i / n) * Math.PI * 2 * 1.03, k = 1 + (rnd() - 0.5) * 0.05;
          pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * ry * k]);
        }
        return smooth(pts);
      };
      const rect = (x, y, w, h) => poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x - 3, y - 2]], 2.5);
      const rays = (cx, cy, r1, r2, n, a0 = 0, span = Math.PI * 2) => {
        let d = "";
        for (let i = 0; i < n; i++) {
          const a = a0 + (i / Math.max(1, n - (span < 6 ? 1 : 0))) * span;
          d += `M${f1(cx + Math.cos(a) * r1)} ${f1(cy + Math.sin(a) * r1)} L${f1(cx + Math.cos(a) * r2)} ${f1(cy + Math.sin(a) * r2)} `;
        }
        return d;
      };
      // heart-shaped leaf whose tip sits at (cx,cy), pointing toward the centre from direction `ang`
      const heart = (cx, cy, k, ang) => {
        const pts = [];
        for (let i = 0; i <= 28; i++) {
          const t = Math.PI + (i / 28) * Math.PI * 2;
          let x = 16 * Math.pow(Math.sin(t), 3) * k, y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) - 17) * k * -1;
          y = (-(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 17) * k;
          const c = Math.cos(ang), s = Math.sin(ang);
          pts.push([cx + x * c - y * s, cy + x * s + y * c]);
        }
        return smooth(pts);
      };

      // ---------- scene + drawing (all times are absolute seconds) ----------
      function scene(start, end, opts = {}) {
        const g = el("g", {}, board);
        const S = { g, start, end };
        S.TL = opts.abs ? IDTL : TL;
        S.TL.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, start);
        S.TL.to(g, { opacity: 0, duration: 0.3, ease: "none" }, end - 0.3);
        // slow camera push-in
        S.TL.fromTo(g, { scale: 1 }, { scale: 1.045, svgOrigin: "960 540", duration: end - start, ease: "none" }, start);
        S.draw = (d, t, dur, o = {}) => {
          const p = el("path", {
            d, pathLength: 1, fill: "none", stroke: o.c || INK, "stroke-width": o.w || 7,
            "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "1 2",
          }, o.parent || g);
          S.TL.fromTo(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: o.ease || "power1.inOut" }, t);
          if (o.fill) {
            p.setAttribute("fill", o.fill);
            p.style.fillOpacity = 0;
            S.TL.to(p, { fillOpacity: 1, duration: 0.3 }, t + dur * 0.8);
          }
          return p;
        };
        S.grp = (parent) => el("g", {}, parent || g);
        return S;
      }

      // stick figure: outer g translates, inner gi rotates, parts inside gi
      function fig(S, cx, gy, o = {}) {
        const s = o.s || 1, sit = !!o.sit;
        const g = el("g", {}, S.g), gi = el("g", {}, g);
        const hip = [cx, gy - (sit ? 10 : 130) * s], sh = [cx, hip[1] - 125 * s], hd = [cx, sh[1] - 45 * s], r = 42 * s;
        const pp = (base, pts) => poly([base, ...pts.map((p) => [base[0] + p[0] * s, base[1] + p[1] * s])], 2);
        const sw = 7 * Math.max(s, 0.85);
        const mk = (d) => el("path", { d, pathLength: 1, fill: "none", stroke: INK, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "1 2", "stroke-dashoffset": 1 }, gi);
        const legsDef = sit ? [[[70, -5], [75, 128]], [[95, 10], [100, 128]]] : [[[-8, 62], [-35, 130]], [[8, 62], [35, 130]]];
        const P = {
          head: mk(circ(hd[0], hd[1], r)),
          body: mk(line([hd[0], hd[1] + r], hip)),
          armL: mk(pp(sh, o.armL || [[-28, 52], [-48, 100]])),
          armR: mk(pp(sh, o.armR || [[28, 52], [48, 100]])),
          legL: mk(pp(hip, o.legL || legsDef[0])),
          legR: mk(pp(hip, o.legR || legsDef[1])),
        };
        const F = { g, gi, P, s, cx, gy, sh, hip, hd };
        F.draw = (t, dur) => {
          const seq = [["head", 0.26], ["body", 0.18], ["armL", 0.14], ["armR", 0.14], ["legL", 0.14], ["legR", 0.14]];
          let tt = t;
          seq.forEach(([k, w]) => {
            S.TL.fromTo(P[k], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: w * dur, ease: "none" }, tt);
            tt += w * dur;
          });
        };
        // simple face: eyes + mouth ("smile" | "sad" | "flat"); dx shifts the look direction
        F.face = (t, kind = "smile", dx = 0) => {
          const e = (x) => S.draw(circ(hd[0] + (x + dx) * s, hd[1] - 6 * s, 4.5 * s), t, 0.12, { parent: gi, w: 5 * s, fill: INK });
          e(-15); e(15);
          const m = kind === "sad" ? [[-14, 24], [0, 14], [14, 24]] : kind === "flat" ? [[-12, 20], [12, 20]] : [[-14, 14], [0, 24], [14, 14]];
          S.draw(smooth(m.map((p) => [hd[0] + (p[0] + dx) * s, hd[1] + p[1] * s - 2 * s])), t + 0.1, 0.2, { parent: gi, w: 5 * s });
        };
        // walking leg sets
        const pair = (a, b) => [mk(pp(hip, a)), mk(pp(hip, b))];
        const WS = [pair([[8, 64], [-50, 124]], [[-4, 66], [34, 132]]), pair([[0, 66], [-10, 132]], [[0, 66], [10, 132]]), pair([[-4, 66], [34, 132]], [[8, 64], [-50, 124]])];
        WS.forEach((pr) => pr.forEach((p) => { p.setAttribute("stroke-dashoffset", 0); p.style.opacity = 0; }));
        const orig = [P.legL, P.legR];
        const showSet = (t, k) => {
          S.TL.set([...orig, ...WS.flat()], { opacity: 0 }, t);
          S.TL.set(k < 0 ? orig : WS[k], { opacity: 1 }, t);
        };
        F.walk = (t0, dur, props, stepLen = 0.2) => {
          S.TL.to(g, { ...props, duration: dur, ease: "none" }, t0);
          const n = Math.floor(dur / stepLen), seq = [0, 1, 2, 1];
          for (let i = 0; i < n; i++) showSet(t0 + i * stepLen, seq[i % 4]);
          showSet(t0 + dur, -1);
        };
        return F;
      }

      // ===================================================================
      // S1  0 – 4.0   "You want to succeed"  — draw hero, turn to viewer, point
      // ===================================================================
      {
        const S = scene(0, 4.0);
        const F = fig(S, 820, GY, { s: 1.45, armR: [[60, 20], [120, 50]] });
        F.draw(0.2, 2.0);
        // arm swings up to point at the viewer
        const pt = el("path", { d: poly([F.sh, [F.sh[0] + 120, F.sh[1] - 25], [F.sh[0] + 215, F.sh[1] - 62]], 2), fill: "none", stroke: INK, "stroke-width": 10, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "1 2", "stroke-dashoffset": 1 }, F.gi);
        S.TL.set(F.P.armR, { opacity: 0 }, 2.5);
        S.TL.fromTo(pt, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.5);
        F.face(2.3, "smile");
        S.draw(poly([[F.sh[0] + 215, F.sh[1] - 62], [F.sh[0] + 250, F.sh[1] - 70]], 1), 2.95, 0.15, { w: 9 });
        S.draw(rays(F.sh[0] + 262, F.sh[1] - 75, 32, 62, 3, -1.0, 0.9), 3.05, 0.3, { w: 6 });
      }

      // ===================================================================
      // S2  4.0 – 8.2   "in life? Here's something"  — ?, scratch head, bulb
      // ===================================================================
      {
        const S = scene(4.0, 8.2), cx = 760;
        const F = fig(S, cx, GY, { s: 1.45, armR: [[60, -10], [46, -66]] });
        F.draw(4.2, 1.6);
        F.face(5.6, "flat");
        // question mark above the figure (drawn on "in life?")
        const qx = 640, qy = 70;
        S.draw(smooth([[qx, qy + 80], [qx + 15, qy + 25], [qx + 75, qy], [qx + 135, qy + 35], [qx + 135, qy + 95], [qx + 80, qy + 140], [qx + 62, qy + 180], [qx + 62, qy + 215]]), 4.9, 0.9, { w: 12 });
        S.draw(circ(qx + 62, qy + 262, 11), 5.85, 0.2, { w: 8, fill: INK });
        // light bulb — "Here's something"
        const bx = 1090, by = 250;
        S.draw(smooth([[bx - 30, by + 52], [bx - 52, by + 10], [bx - 46, by - 40], [bx, by - 66], [bx + 46, by - 40], [bx + 52, by + 10], [bx + 30, by + 52]]), 6.3, 0.55, { fill: YEL });
        S.draw(poly([[bx - 30, by + 52], [bx + 30, by + 52]], 1), 6.8, 0.15);
        S.draw(poly([[bx - 24, by + 72], [bx + 24, by + 72]], 1), 6.9, 0.12);
        S.draw(poly([[bx - 14, by + 90], [bx + 14, by + 90]], 1), 7.0, 0.1);
        S.draw(smooth([[bx - 14, by + 52], [bx - 6, by + 20], [bx + 6, by + 20], [bx + 14, by + 52]]), 7.0, 0.3, { w: 5 });
        S.draw(rays(bx, by - 8, 82, 118, 7, -2.8, 2.5), 7.2, 0.5, { w: 6 });
      }

      // ===================================================================
      // S3  8.2 – 12.6   "most people won't tell you"  — 4 figures, 3 leave
      // ===================================================================
      {
        const S = scene(8.2, 12.6);
        const xs = [640, 1010, 1190, 1370];
        const fs = xs.map((x, i) => {
          const F = fig(S, x, GY, { s: 0.78 });
          F.draw(8.4 + i * 0.35, 0.9);
          return F;
        });
        fs[0].face(9.9, "flat");
        [1, 2, 3].forEach((i) => fs[i].walk(10.4 + i * 0.12, 1.7, { x: 1000 }));
        // speech bubble above the one who stays
        S.draw(smooth([[470, 420], [500, 330], [640, 300], [790, 330], [820, 420], [790, 500], [650, 520], [560, 505], [520, 560], [525, 495], [490, 470], [470, 420]]), 11.0, 1.0, { w: 7 });
        [590, 650, 710].forEach((x, i) => S.draw(circ(x, 410, 9), 11.9 + i * 0.12, 0.1, { w: 8, fill: INK }));
      }

      // ===================================================================
      // S4  12.6 – 17.0   "You don't need to be the smartest"  — brain shoved aside
      // ===================================================================
      {
        const S = scene(12.6, 17.0);
        const B = S.grp(), bcx = 830, bcy = 470;
        const pts = [];
        for (let i = 0; i <= 26; i++) {
          const a = (i / 26) * Math.PI * 2 + 0.5;
          const k = 1 + 0.1 * Math.sin(a * 8);
          pts.push([bcx + Math.cos(a) * 250 * k, bcy + Math.sin(a) * 170 * k * (Math.sin(a) > 0 ? 0.85 : 1)]);
        }
        S.draw(smooth(pts), 12.8, 1.5, { parent: B, w: 8, fill: PINK });
        S.draw(smooth([[bcx - 10, bcy - 165], [bcx + 12, bcy - 80], [bcx - 14, bcy], [bcx + 6, bcy + 100]]), 14.2, 0.5, { parent: B, w: 6 });
        S.draw(smooth([[bcx - 190, bcy - 30], [bcx - 150, bcy - 100], [bcx - 100, bcy - 40], [bcx - 60, bcy - 110]]), 14.4, 0.4, { parent: B, w: 5 });
        S.draw(smooth([[bcx + 50, bcy - 90], [bcx + 100, bcy - 30], [bcx + 150, bcy - 100], [bcx + 200, bcy - 40]]), 14.6, 0.4, { parent: B, w: 5 });
        S.draw(smooth([[bcx - 160, bcy + 60], [bcx - 100, bcy + 20], [bcx - 50, bcy + 90], [bcx + 0, bcy + 50]]), 14.8, 0.4, { parent: B, w: 5 });
        S.draw(smooth([[bcx + 70, bcy + 70], [bcx + 130, bcy + 110], [bcx + 190, bcy + 60]]), 14.9, 0.35, { parent: B, w: 5 });
        S.draw(smooth([[bcx + 110, bcy + 168], [bcx + 125, bcy + 215], [bcx + 160, bcy + 235]]), 15.0, 0.3, { parent: B, w: 7 });
        S.draw(rays(bcx, bcy, 300, 345, 9, -2.5, 2.6), 15.2, 0.5, { parent: B, w: 6 });
        const F = fig(S, 1500, GY, { s: 1.3, armL: [[-45, 5], [-90, -50]], armR: [[45, 5], [90, -50]] });
        F.draw(13.4, 1.4);
        F.face(14.9, "flat");
        // shrug (arms up) then push the brain away
        const push = el("path", { d: poly([F.sh, [F.sh[0] - 170, F.sh[1] + 15], [F.sh[0] - 290, F.sh[1] - 4]], 2), fill: "none", stroke: INK, "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, F.gi);
        push.style.opacity = 0;
        S.TL.set(F.P.armL, { opacity: 0 }, 16.0);
        S.TL.set(push, { opacity: 1 }, 16.0);
        S.TL.to(B, { x: -760, rotation: -24, svgOrigin: `${bcx} ${bcy}`, duration: 0.8, ease: "power2.in" }, 16.05);
      }

      // ===================================================================
      // S5  17.0 – 21.8   "person in the room. You don't need…"  — classroom
      // ===================================================================
      {
        const S = scene(17.0, 21.8);
        S.draw(rect(540, 110, 1060, 270), 17.1, 0.8, { w: 8 });
        S.draw(poly([[540, 380], [1600, 380]], 1) , 17.8, 0.3, { w: 12 });
        S.draw(smooth([[620, 200], [700, 170], [780, 210], [860, 175], [940, 210]]), 17.8, 0.5, { w: 5 });
        S.draw(smooth([[620, 280], [760, 255], [900, 290], [1040, 262]]), 18.1, 0.5, { w: 5 });
        S.draw(poly([[1150, 200], [1230, 200]], 1) + poly([[1190, 160], [1190, 240]], 1) + poly([[1280, 185], [1360, 185]], 1) + poly([[1280, 225], [1360, 225]], 1), 18.3, 0.6, { w: 5 });
        // podium + winner on top (arms up)
        S.draw(poly([[260, 800], [440, 800], [440, 860], [260, 860], [260, 800]], 2), 17.3, 0.6, { w: 8 });
        S.draw(smooth([[345, 825], [350, 835], [345, 845]]) + poly([[352, 822], [352, 848]], 1), 17.9, 0.3, { w: 6 });
        const T = fig(S, 350, 800, { s: 0.6, armL: [[-30, -20], [-45, -75]], armR: [[30, -20], [45, -75]] });
        T.draw(17.5, 1.1);
        // desks, chairs, students
        [900, 1130, 1360].forEach((x, i) => {
          const t = 18.0 + i * 0.35;
          S.draw(poly([[x - 70, 600], [x + 70, 600]], 2), t, 0.25, { w: 8 });
          S.draw(poly([[x - 55, 600], [x - 55, 670]], 2) + poly([[x + 55, 600], [x + 55, 670]], 2), t + 0.15, 0.25);
          const F = fig(S, x, 550, { s: 0.42, sit: false, armR: i === 1 ? [[20, -40], [20, -95]] : undefined });
          F.draw(t + 0.1, 0.75);
        });
        const M = fig(S, 560, GY, { s: 0.8 });
        M.draw(19.0, 1.0);
        M.face(20.0, "flat", 4);
        M.walk(20.2, 1.6, { x: 1500 });
      }

      // ===================================================================
      // S6  21.8 – 27.2   "connections, luck, or even a"  — 3 symbols, all crossed out
      // ===================================================================
      {
        const S = scene(21.8, 27.2);
        // handshake — "connections"
        const a = fig(S, 280, 700, { s: 0.7, armR: [[60, 25], [165, 40]] });
        const b = fig(S, 560, 700, { s: 0.7, armL: [[-60, 25], [-165, 40]] });
        a.draw(22.1, 1.1); b.draw(22.3, 1.1);
        S.draw(circ(420, 549, 15), 23.3, 0.2, { w: 7, fill: "#fff" });
        // four-leaf clover — "luck"
        const cx = 960, cy = 420;
        [0, 1, 2, 3].forEach((i) => {
          const ang = (i * Math.PI) / 2 + Math.PI / 4;
          S.draw(heart(cx, cy, 3.9, ang), 23.15 + i * 0.22, 0.5, { w: 6, fill: LEAF });
        });
        S.draw(smooth([[cx, cy], [cx + 12, cy + 80], [cx - 6, cy + 160], [cx - 52, cy + 215]]), 24.1, 0.5, { c: GREEN, w: 7 });
        // horseshoe with nail holes — "or even a …"
