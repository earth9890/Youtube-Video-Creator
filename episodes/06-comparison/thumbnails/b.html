<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Caveat"; src: url("../assets/fonts/Caveat.ttf") format("truetype"); font-weight: 400 700; }
      @font-face { font-family: "PH"; src: url("../assets/fonts/PatrickHand.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #25272a; }
      #root { position: relative; width: 100%; height: 100%; background: #25272a; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cap { position: absolute; left: 0; right: 0; bottom: 16px; height: 84px; display: flex; justify-content: center; align-items: center; gap: 16px;
             font-family: "Caveat", cursive; font-weight: 700; font-size: 66px; color: #f1efe8; opacity: 0; white-space: nowrap; }
      .cap span { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.0" data-width="1920" data-height="1080">
      <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="marker" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n" />
            <feDisplacementMap in="SourceGraphic" in2="n" scale="5" />
          </filter>
        </defs>
        <g id="board" filter="url(#marker)"></g>
      </svg>
      <div id="caps"></div>
      
    </div>
    <script>
      const THEME = "dark";
      const TIMING = {"total": 1.0, "words": [], "chunks": [], "clips": []};
      window.__timelines = window.__timelines || {};
// =====================================================================================
// whiteboard-video-studio ENGINE v2 — hand-drawn whiteboard / chalkboard toolkit (HyperFrames + GSAP)
// Globals required BEFORE this file (build.py injects them): THEME ("light"|"dark"), TIMING (words.json).
// Full API + examples: references/engine-api.md. Every time argument is ABSOLUTE seconds.
// =====================================================================================
const NS = "http://www.w3.org/2000/svg";
const DARK = THEME === "dark";
const PAPER = DARK ? "#25272a" : "#fdfcf8";
const INK = DARK ? "#f1efe8" : "#161616";
const RED = DARK ? "#ff6b5e" : "#e0312b";
const GREEN = DARK ? "#62d377" : "#2f9e44";
const ORANGE = "#ff8a2a";
const YEL = "#ffd23f";
const BLUE = DARK ? "#86b6ff" : "#3d6fb6";
const GRAY = DARK ? "#8d9095" : "#a2a2a2";
const LEAF = DARK ? "#5f9e68" : "#a8dca8";
const SKY = DARK ? "#36475f" : "#d9ecff";
const PINK = DARK ? "#7b4a55" : "#ffd9df";
const CREAM = DARK ? "#3a3933" : "#fff6e3";
const GLOW = DARK ? "#fff2b0" : "#ffe9a8";
const GY = 860; // ground line (captions live below ~980)

const tl = gsap.timeline({ paused: true });
const board = document.getElementById("board");
const defs = document.querySelector("#stage defs");
const TOTAL = TIMING.total;

// ---------- timing ----------
const WORD = (c, i) => {
  const w = TIMING.words.find((x) => x[0] === c && x[1] === i);
  if (!w) throw new Error("no word " + c + ":" + i);
  return w;
};
const W = (c, i) => WORD(c, i)[3]; // word start (clip is 1-based, word index 0-based)
const WE = (c, i) => WORD(c, i)[4]; // word end
const CLIP = (c) => TIMING.clips[c - 1]; // [start, end] of a spoken sentence
// cues: [[clip, wordIdx], ...] — first cue is the opening scene (starts at 0, animation lead-in)
function sceneWindows(cues, lead = 0.4) {
  const st = cues.map((q, k) => (k === 0 ? 0 : +(W(q[0], q[1]) - lead).toFixed(3)));
  return st.map((s, k) => [s, k + 1 < st.length ? st[k + 1] : TOTAL]);
}

// ---------- deterministic hand-drawn path helpers ----------
let seed = 11;
const rnd = () => ((seed = (seed * 16807) % 2147483647), (seed - 1) / 2147483646);
const J = (a) => (rnd() - 0.5) * a;
const f1 = (n) => n.toFixed(1);
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
};
const poly = (pts, jit = 3) => pts.map((p, i) => `${i ? "L" : "M"}${f1(p[0] + J(jit))} ${f1(p[1] + J(jit))}`).join(" ");
const line = (a, b, bow = 8) => {
  const mx = (a[0] + b[0]) / 2 + J(bow), my = (a[1] + b[1]) / 2 + J(bow);
  return `M${f1(a[0] + J(3))} ${f1(a[1] + J(3))} Q${f1(mx)} ${f1(my)} ${f1(b[0] + J(3))} ${f1(b[1] + J(3))}`;
};
const smooth = (pts) => {
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${f1(p1[0] + (p2[0] - p0[0]) / 6)} ${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)} ${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d;
};
const circ = (cx, cy, r, ry = r) => {
  const n = 16, a0 = rnd() * 6.28, pts = [];
  for (let i = 0; i <= n + 1; i++) {
    const a = a0 + (i / n) * Math.PI * 2 * 1.03, k = 1 + (rnd() - 0.5) * 0.05;
    pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * ry * k]);
  }
  return smooth(pts);
};
const rect = (x, y, w, h) => poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x - 3, y - 2]], 2.5);
const rrect = (x, y, w, h, r) => {
  const j = () => J(1.5);
  return `M${f1(x + r)} ${f1(y + j())} L${f1(x + w - r)} ${f1(y + j())} Q${f1(x + w)} ${f1(y)} ${f1(x + w + j())} ${f1(y + r)} L${f1(x + w + j())} ${f1(y + h - r)} Q${f1(x + w)} ${f1(y + h)} ${f1(x + w - r)} ${f1(y + h + j())} L${f1(x + r)} ${f1(y + h + j())} Q${f1(x)} ${f1(y + h)} ${f1(x + j())} ${f1(y + h - r)} L${f1(x + j())} ${f1(y + r)} Q${f1(x)} ${f1(y)} ${f1(x + r + 4)} ${f1(y - 1)}`;
};
const arcPts = (cx, cy, r, a0, a1, n = 18, ry = r) => {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = ((a0 + (i / n) * (a1 - a0)) * Math.PI) / 180; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * ry]); }
  return pts;
};
const arc = (cx, cy, r, a0, a1, ry = r) => smooth(arcPts(cx, cy, r, a0, a1, 18, ry));
const rays = (cx, cy, r1, r2, n, a0 = 0, span = Math.PI * 2) => {
  let d = "";
  for (let i = 0; i < n; i++) {
    const a = a0 + (i / Math.max(1, n - (span < 6 ? 1 : 0))) * span;
    d += `M${f1(cx + Math.cos(a) * r1)} ${f1(cy + Math.sin(a) * r1)} L${f1(cx + Math.cos(a) * r2)} ${f1(cy + Math.sin(a) * r2)} `;
  }
  return d;
};
// full heart, ~64*s wide, centred
const heartPath = (cx, cy, s = 1) => {
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const t = Math.PI + (i / 30) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3), y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    pts.push([cx + x * 2 * s, cy + (y + 2) * 2 * s]);
  }
  return smooth(pts);
};
// leaf-shaped heart whose tip sits at (cx,cy), rotated by ang (radians) — clover leaves
const leafHeart = (cx, cy, k, ang) => {
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const t = Math.PI + (i / 28) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3) * k;
    const y = (-(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 17) * k;
    const c = Math.cos(ang), s = Math.sin(ang);
    pts.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return smooth(pts);
};
const arrowHead = (x, y, ang, len = 22) => {
  const a1 = ang + Math.PI * 0.82, a2 = ang - Math.PI * 0.82;
  return `M${f1(x + Math.cos(a1) * len)} ${f1(y + Math.sin(a1) * len)} L${f1(x)} ${f1(y)} L${f1(x + Math.cos(a2) * len)} ${f1(y + Math.sin(a2) * len)}`;
};

// ---------- scenes ----------
let CLIPN = 0;
function scene(start, end, o = {}) {
  const g = el("g", {}, board);
  const S = { g, start, end, len: end - start };
  if (start > 0.001) tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, start);
  if (end < TOTAL - 0.05) tl.to(g, { opacity: 0, duration: 0.25, ease: "none" }, end - 0.25);
  const cam = o.cam === undefined ? "push" : o.cam; // push | pull | zoom | none
  const sc = { push: [1, 1.04], pull: [1.07, 1], zoom: [1, 1.12] }[cam];
  if (sc) tl.fromTo(g, { scale: sc[0] }, { scale: sc[1], svgOrigin: o.focus || "960 540", duration: S.len, ease: "none" }, start);
  S.at = (f) => start + f * S.len; // fraction of the scene -> absolute time
  S.d = (f) => f * S.len; // fraction of the scene -> duration
  S.grp = (parent) => el("g", {}, parent || g);
  S.draw = (d, t, dur, op = {}) => {
    const p = el("path", { d, pathLength: 1, fill: "none", stroke: op.c || INK, "stroke-width": op.w || 7, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "1 2" }, op.parent || g);
    if (op.op !== undefined) p.setAttribute("opacity", op.op);
    tl.fromTo(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: Math.max(0.02, dur), ease: op.ease || "power1.inOut" }, t);
    if (op.fill) {
      p.setAttribute("fill", op.fill);
      p.style.fillOpacity = 0;
      tl.to(p, { fillOpacity: op.fo === undefined ? 1 : op.fo, duration: 0.3 }, t + dur * 0.75);
    }
    return p;
  };
  // filled shape without outline, fades in
  S.fill = (d, t, dur, color, opacity = 1, parent) => {
    const p = el("path", { d, fill: color, stroke: "none" }, parent || g);
    tl.fromTo(p, { opacity: 0 }, { opacity, duration: Math.max(0.05, dur) }, t);
    return p;
  };
  // parts: [[d, weight, opts], ...] drawn one after another inside [t, t+dur]
  S.seq = (parts, t, dur, parent) => {
    const tot = parts.reduce((a, p) => a + (p[1] || 1), 0);
    let tt = t;
    return parts.map((p) => {
      const dd = (dur * (p[1] || 1)) / tot, op = Object.assign({ parent: parent || g }, p[2] || {});
      const e = S.draw(p[0], tt, dd, op);
      tt += dd;
      return e;
    });
  };
  // handwritten text, revealed left->right like a marker. size = font px. font: "ph" (Patrick Hand caps-friendly) | "caveat"
  S.text = (str, x, y, op = {}) => {
    const size = op.size || 64, t = op.t === undefined ? start : op.t, dur = op.dur === undefined ? Math.min(1.2, 0.05 * str.length + 0.25) : op.dur;
    const anchor = op.anchor || "middle", id = "tclip" + ++CLIPN;
    const cp = el("clipPath", { id }, defs);
    const wEst = str.length * size * (op.font === "caveat" ? 0.48 : 0.56) + size;
    const x0 = anchor === "middle" ? x - wEst / 2 : anchor === "end" ? x - wEst : x - size * 0.2;
    const r = el("rect", { x: x0, y: y - size * 1.15, width: 0, height: size * 1.6 }, cp);
    const te = el("text", { x, y, "text-anchor": anchor, "font-family": op.font === "caveat" ? "Caveat" : "PH", "font-size": size, fill: op.c || INK, "clip-path": `url(#${id})` }, op.parent || g);
    if (op.weight) te.setAttribute("font-weight", op.weight);
    if (op.spacing) te.setAttribute("letter-spacing", op.spacing);
    te.textContent = str;
    tl.fromTo(r, { attr: { width: 0 } }, { attr: { width: wEst }, duration: dur, ease: "none" }, t);
    return te;
  };
  S.fadeIn = (e, t, dur = 0.3) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: dur }, t);
  S.fadeOut = (e, t, dur = 0.3) => tl.to(e, { opacity: 0, duration: dur }, t);
  S.show = (e, t) => tl.set(e, { opacity: 1 }, t);
  S.hide = (e, t) => tl.set(e, { opacity: 0 }, t);
  S.move = (e, t, dur, props, ease = "power2.inOut") => tl.to(e, Object.assign({ duration: dur, ease }, props), t);
  S.pop = (e, t, cx, cy, dur = 0.35) => tl.fromTo(e, { scale: 0.001 }, { scale: 1, svgOrigin: `${cx} ${cy}`, duration: dur, ease: "back.out(2)" }, t);
  S.tilt = (deg, t, dur = 0.3) => tl.to(g, { rotation: deg, svgOrigin: "960 540", duration: dur, ease: "power2.out" }, t);
  S.fig = (...a) => fig(S, ...a);
  for (const k in PROPS) S[k] = (...a) => PROPS[k](S, ...a);
  return S;
}

// ---------- stick figure ----------
const POSES = {
  stand: [[[-28, 52], [-48, 100]], [[28, 52], [48, 100]]],
  sad: [[[-18, 55], [-26, 106]], [[18, 55], [26, 106]]],
  point: [[[-28, 52], [-48, 100]], [[70, -5], [140, -30]]],
  pointL: [[[-70, -5], [-140, -30]], [[28, 52], [48, 100]]],
  armsUp: [[[-35, -20], [-62, -82]], [[35, -20], [62, -82]]],
  shrug: [[[-45, 5], [-90, -50]], [[45, 5], [90, -50]]],
  think: [[[-28, 52], [-48, 100]], [[48, 35], [14, -8]]],
  hips: [[[-46, 45], [-12, 96]], [[46, 45], [12, 96]]],
  wave: [[[-28, 52], [-48, 100]], [[58, -18], [78, -92]]],
  cross: [[[32, 48], [-38, 58]], [[-32, 48], [38, 58]]],
  head: [[[-58, -12], [-34, -64]], [[58, -12], [34, -64]]],
  reach: [[[-28, 52], [-48, 100]], [[62, 10], [134, 8]]],
  reachL: [[[-62, 10], [-134, 8]], [[28, 52], [48, 100]]],
  hold: [[[-30, 50], [-8, 82]], [[30, 50], [10, 80]]], // both hands together in front (holding phone/book)
  push: [[[-28, 52], [-48, 100]], [[90, 10], [170, 2]]],
};
// fig(S, cx, groundY, {s, pose, armL, armR, legL, legR, sit, c, parent, face})
function fig(S, cx, gy, o = {}) {
  const s = o.s || 1, sit = !!o.sit, col = o.c || INK;
  const g = el("g", {}, o.parent || S.g), gi = el("g", {}, g);
  const hip = [cx, gy - (sit ? 10 : 130) * s], sh = [cx, hip[1] - 125 * s], hd = [cx, sh[1] - 45 * s], r = 42 * s;
  const pp = (base, pts) => poly([base, ...pts.map((p) => [base[0] + p[0] * s, base[1] + p[1] * s])], 2);
  const sw = o.w || 7 * Math.max(s, 0.85);
  const mk = (d, hidden) => {
    const p = el("path", { d, pathLength: 1, fill: "none", stroke: col, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": "1 2", "stroke-dashoffset": hidden ? 0 : 1 }, gi);
    if (hidden) p.style.opacity = 0;
    return p;
  };
  const pose = POSES[o.pose || "stand"];
  const legsDef = sit ? [[[70, -5], [75, 128]], [[95, 10], [100, 128]]] : [[[-8, 62], [-35, 130]], [[8, 62], [35, 130]]];
  const P = {
    head: mk(circ(hd[0], hd[1], r)),
    body: mk(line([hd[0], hd[1] + r], hip)),
    armL: mk(pp(sh, o.armL || pose[0])),
    armR: mk(pp(sh, o.armR || pose[1])),
    legL: mk(pp(hip, o.legL || legsDef[0])),
    legR: mk(pp(hip, o.legR || legsDef[1])),
  };
  const F = { g, gi, P, s, cx, gy, sh, hip, hd, r, arms: [P.armL, P.armR], faceG: null };
  F.hand = (side = "R", poseName) => {
    const ps = poseName ? POSES[poseName] : [o.armL || pose[0], o.armR || pose[1]];
    const last = (side === "L" ? ps[0] : ps[1]).slice(-1)[0];
    return [sh[0] + last[0] * s, sh[1] + last[1] * s];
  };
  F.top = () => [cx, hd[1] - r];
  F.draw = (t, dur) => {
    const seq = [["head", 0.26], ["body", 0.18], ["armL", 0.14], ["armR", 0.14], ["legL", 0.14], ["legR", 0.14]];
    let tt = t;
    seq.forEach(([k, w]) => {
      tl.fromTo(P[k], { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: Math.max(0.02, w * dur), ease: "none" }, tt);
      tt += w * dur;
    });
    return F;
  };
  F.instant = (t) => { Object.values(P).forEach((p) => tl.set(p, { strokeDashoffset: 0 }, t)); return F; };
  // switch arms to a named pose (or custom [armL, armR]) at time t — instant swap reads as a gesture
  F.setPose = (t, name, custom) => {
    const ps = custom || POSES[name];
    const nl = mk(pp(sh, ps[0]), true), nr = mk(pp(sh, ps[1]), true);
    tl.set(F.arms, { opacity: 0 }, t);
    tl.set([nl, nr], { opacity: 1 }, t);
    F.arms = [nl, nr];
    return F;
  };
  // faces: smile | happy | sad | flat | wow | worried | sleep | determined. dx shifts gaze.
  F.face = (t, kind = "smile", dx = 0) => {
    const fg = el("g", {}, gi);
    if (F.faceG) tl.set(F.faceG, { opacity: 0 }, t);
    F.faceG = fg;
    const X = (v) => hd[0] + (v + dx) * s, Y = (v) => hd[1] + v * s;
    const dr = (d, w, fill) => S.draw(d, t, 0.15, { parent: fg, w: w * s, c: col, fill });
    if (kind === "sleep") { dr(arc(X(-15), Y(-6), 7, 20, 160), 4); dr(arc(X(15), Y(-6), 7, 20, 160), 4); }
    else { dr(circ(X(-15), Y(-6), 4.5), 5, col); dr(circ(X(15), Y(-6), 4.5), 5, col); }
    const m = {
      smile: [[-14, 13], [0, 23], [14, 13]], happy: [[-17, 10], [0, 27], [17, 10]], sad: [[-14, 24], [0, 14], [14, 24]],
      flat: [[-12, 19], [12, 19]], worried: [[-14, 21], [-5, 16], [5, 22], [14, 17]], determined: [[-12, 18], [12, 16]], sleep: [[-6, 18], [6, 18]],
    }[kind];
    if (kind === "wow") dr(circ(X(0), Y(18), 6, 8), 4);
    else dr(smooth(m.map((p) => [X(p[0]), Y(p[1])])), 5);
    if (kind === "determined" || kind === "worried") {
      const k = kind === "determined" ? 1 : -1;
      dr(line([X(-24), Y(-18 - 4 * k)], [X(-7), Y(-15 + 3 * k)], 1), 4);
      dr(line([X(24), Y(-18 - 4 * k)], [X(7), Y(-15 + 3 * k)], 1), 4);
    }
    return fg;
  };
  const pair = (a, b) => [mk(pp(hip, a), true), mk(pp(hip, b), true)];
  const WS = [pair([[8, 64], [-50, 124]], [[-4, 66], [34, 132]]), pair([[0, 66], [-10, 132]], [[0, 66], [10, 132]]), pair([[-4, 66], [34, 132]], [[8, 64], [-50, 124]])];
  const orig = [P.legL, P.legR];
  const showSet = (t, k) => { tl.set([...orig, ...WS.flat()], { opacity: 0 }, t); tl.set(k < 0 ? orig : WS[k], { opacity: 1 }, t); };
  // walk: translate outer group by props ({x, y}) with a leg cycle
  F.walk = (t0, dur, props, stepLen = 0.2) => {
    tl.to(g, Object.assign({ duration: dur, ease: "none" }, props), t0);
    const n = Math.floor(dur / stepLen), q = [0, 1, 2, 1];
    for (let i = 0; i < n; i++) showSet(t0 + i * stepLen, q[i % 4]);
    showSet(t0 + dur, -1);
    return F;
  };
  F.lie = (t, dur = 0.35, deg = 88) => (tl.to(gi, { rotation: deg, svgOrigin: `${cx} ${gy}`, duration: dur, ease: "power2.in" }, t), F);
  F.rise = (t, dur = 0.6) => (tl.to(gi, { rotation: 0, svgOrigin: `${cx} ${gy}`, duration: dur, ease: "power2.out" }, t), F);
  F.grow = (t, dur, k) => (tl.to(gi, { scale: k, svgOrigin: `${cx} ${gy}`, duration: dur, ease: "power2.inOut" }, t), F);
  F.slump = (t, dur = 0.4, deg = 10) => (tl.to(gi, { rotation: deg, svgOrigin: `${cx} ${hip[1]}`, duration: dur }, t), F);
  if (o.face) F.face(o.faceT === undefined ? S.start : o.faceT, o.face);
  return F;
}

// ---------- props: every prop(S, ..., t, dur, o) draws inside [t, t+dur] and returns {g, ...} ----------
const PROPS = {
  // phone centred at (x,y); o.screen: play|chat|feed|heart|blank ; o.glow adds light rays
  phone(S, x, y, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent), w = 74 * s, h = 136 * s;
    const parts = [
      [rrect(x - w / 2, y - h / 2, w, h, 12 * s), 3, { w: 6, fill: PAPER }],

  thought(S, cx, cy, rx, ry, tx, ty, t, dur, o = {}) {

    for (let i = 0; i <= 14; i++) { const a = (i / 14) * Math.PI * 2, k = 1 + (i % 2 ? 0.1 : -0.02); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    S.draw(smooth(pts), t, dur * 0.75, { w: 6, fill: o.fill || PAPER, parent: g });
    [0.35, 0.65].forEach((f, i) => { const bx = cx + (tx - cx) * (0.55 + f * 0.45), by = cy + ry * 0.9 + (ty - cy - ry * 0.9) * f; S.draw(circ(bx, by, 14 - i * 5), t + dur * (0.75 + i * 0.12), dur * 0.12, { w: 5, fill: PAPER, parent: g }); });
    return { g };
  },
  speech(S, cx, cy, rx, ry, tx, ty, t, dur, o = {}) {
    const g = S.grp(o.parent), pts = arcPts(cx, cy, rx, 100, 440, 20, ry), a = pts[0];
    S.draw(smooth(pts), t, dur * 0.8, { w: 6, fill: o.fill || PAPER, parent: g });
    S.draw(poly([[a[0] - 30, a[1] - 6], [tx, ty], [a[0] + 10, a[1] - 4]], 1), t + dur * 0.8, dur * 0.2, { w: 6, parent: g });
    return { g };
  },
  // stairs from (x,y) going right/up; returns step-top centres
  stairs(S, x, y, n, run, rise, t, dur, o = {}) {
    const g = S.grp(o.parent), pts = [[x, y]], tops = [];
    for (let i = 0; i < n; i++) { tops.push([x + run * i + run / 2, y - rise * i]); pts.push([x + run * (i + 1), y - rise * i]); pts.push([x + run * (i + 1), y - rise * (i + 1)]); }
    S.draw(poly(pts, 3), t, dur, { w: 8, parent: g });
    return { g, tops };
  },
  mountain(S, pts, t, dur, o = {}) { return { g: S.draw(poly(pts, 2), t, dur, { w: 8, ease: "none", parent: o.parent, fill: o.fill }) }; },
  desk(S, x, y, w, t, dur, o = {}) { // x = left, y = floor; top at y-220
    const g = S.grp(o.parent);
    S.seq([[rect(x, y - 220, w, 24), 2, { w: 7 }], [poly([[x + 30, y - 196], [x + 30, y]], 2) + poly([[x + w - 30, y - 196], [x + w - 30, y]], 2), 1, { w: 6 }]], t, dur, g);

  chair(S, x, y, t, dur, o = {}) { // seat front-left x, floor y; seat height 125, faces right

    S.draw(poly([[x - 90, y - 245], [x - 90, y - 125], [x, y - 125], [x, y]], 2) + poly([[x - 90, y - 125], [x - 90, y]], 2), t, dur, { w: 6, parent: g });
    return { g, seatY: y - 125 };
  },
  couch(S, x, y, w, t, dur, o = {}) { // x left, y floor; seat top ≈ y-120
    const g = S.grp(o.parent);
    S.seq([
      [smooth([[x + 30, y - 100], [x + 25, y - 270], [x + 60, y - 300], [x + w - 60, y - 300], [x + w - 25, y - 270], [x + w - 30, y - 100]]), 2, { w: 7, fill: CREAM }],
      [rect(x, y - 130, w, 90), 1.5, { w: 7, fill: CREAM }],
      [smooth([[x, y - 125], [x - 20, y - 170], [x + 22, y - 180], [x + 40, y - 125]]) + smooth([[x + w, y - 125], [x + w + 20, y - 170], [x + w - 22, y - 180], [x + w - 40, y - 125]]), 1, { w: 6 }],
      [poly([[x + 30, y - 40], [x + 30, y]], 1) + poly([[x + w - 30, y - 40], [x + w - 30, y]], 1), 0.4, { w: 7 }],
    ], t, dur, g);
    return { g, seatY: y - 130 };
  },
  dumbbell(S, cx, cy, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent);
    S.seq([[line([cx - 70 * s, cy], [cx + 70 * s, cy], 1), 1, { w: 9 }], [rrect(cx - 92 * s, cy - 42 * s, 26 * s, 84 * s, 6) + rrect(cx + 66 * s, cy - 42 * s, 26 * s, 84 * s, 6), 2, { w: 6, fill: GRAY }]], t, dur, g);
    return { g };
  },
  shirt(S, cx, cy, s = 1, t, dur, o = {}) { // T-shirt centred; o.print draws a small face
    const g = S.grp(o.parent), k = s;
    S.draw(poly([[cx - 40 * k, cy - 80 * k], [cx - 105 * k, cy - 45 * k], [cx - 80 * k, cy], [cx - 58 * k, cy - 14 * k], [cx - 58 * k, cy + 90 * k], [cx + 58 * k, cy + 90 * k], [cx + 58 * k, cy - 14 * k], [cx + 80 * k, cy], [cx + 105 * k, cy - 45 * k], [cx + 40 * k, cy - 80 * k], [cx + 20 * k, cy - 62 * k], [cx - 20 * k, cy - 62 * k], [cx - 40 * k, cy - 80 * k]], 2), t, dur * (o.print ? 0.7 : 1), { w: 6, fill: o.fill || SKY, parent: g });
    if (o.print) { S.draw(circ(cx, cy + 12 * k, 26 * k), t + dur * 0.7, dur * 0.15, { w: 4, parent: g, fill: YEL }); S.draw(smooth([[cx - 12 * k, cy + 18 * k], [cx, cy + 28 * k], [cx + 12 * k, cy + 18 * k]]) + circ(cx - 9 * k, cy + 5 * k, 3) + circ(cx + 9 * k, cy + 5 * k, 3), t + dur * 0.85, dur * 0.15, { w: 3.5, parent: g }); }
    return { g };
  },
  magnifier(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent);
    S.seq([[circ(cx, cy, r), 2, { w: 7, fill: o.fill || (DARK ? "#2f3a48" : "#eef6ff") }], [line([cx + r * 0.7, cy + r * 0.7], [cx + r * 1.6, cy + r * 1.6], 1), 1, { w: 14 }]], t, dur, g);

  },
  padlock(S, cx, cy, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent);
    S.seq([[arc(cx, cy - 30 * s, 34 * s, 180, 360), 1.2, { w: 9 }], [rrect(cx - 52 * s, cy - 30 * s, 104 * s, 84 * s, 8), 2, { w: 7, fill: YEL }], [circ(cx, cy + 6 * s, 8 * s), 0.4, { w: 5, fill: INK }]], t, dur, g);

  },
  hourglass(S, cx, cy, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent);
    S.seq([[line([cx - 50 * s, cy - 80 * s], [cx + 50 * s, cy - 80 * s], 1) + line([cx - 50 * s, cy + 80 * s], [cx + 50 * s, cy + 80 * s], 1), 1, { w: 8 }], [smooth([[cx - 40 * s, cy - 80 * s], [cx - 34 * s, cy - 30 * s], [cx - 6 * s, cy], [cx - 34 * s, cy + 30 * s], [cx - 40 * s, cy + 80 * s]]) + smooth([[cx + 40 * s, cy - 80 * s], [cx + 34 * s, cy - 30 * s], [cx + 6 * s, cy], [cx + 34 * s, cy + 30 * s], [cx + 40 * s, cy + 80 * s]]), 2, { w: 6 }], [poly([[cx - 26 * s, cy + 78 * s], [cx, cy + 40 * s], [cx + 26 * s, cy + 78 * s], [cx - 26 * s, cy + 78 * s]], 1), 1, { w: 4, fill: YEL }]], t, dur, g);

  coffee(S, cx, cy, s = 1, t, dur, o = {}) { // (cx,cy) = cup base centre
    const g = S.grp(o.parent);
    S.seq([[poly([[cx - 45 * s, cy - 90 * s], [cx + 45 * s, cy - 90 * s], [cx + 36 * s, cy], [cx - 36 * s, cy], [cx - 45 * s, cy - 90 * s]], 2), 2, { w: 6, fill: CREAM }], [arc(cx + 50 * s, cy - 55 * s, 22 * s, -80, 90), 0.8, { w: 6 }], [smooth([[cx - 14 * s, cy - 105 * s], [cx - 4 * s, cy - 125 * s], [cx - 16 * s, cy - 145 * s]]) + smooth([[cx + 14 * s, cy - 105 * s], [cx + 24 * s, cy - 125 * s], [cx + 12 * s, cy - 145 * s]]), 1, { w: 4, c: GRAY }]], t, dur, g);

  // circular timer that fills over [t0, t0+fillDur]; label optional ("2:00")
  timer(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent);
    S.draw(circ(cx, cy, r), t, dur * 0.6, { w: 7, fill: PAPER, parent: g });
    S.draw(line([cx - 18, cy - r - 14], [cx + 18, cy - r - 14], 1) + line([cx, cy - r - 14], [cx, cy - r], 1), t + dur * 0.6, dur * 0.2, { w: 7, parent: g });
    const prog = el("path", { d: arc(cx, cy, r * 0.62, -90, 270), fill: "none", stroke: o.c || GREEN, "stroke-width": r * 0.9, pathLength: 1, "stroke-dasharray": "1 2", "stroke-dashoffset": 1, opacity: 0.55 }, g);
    if (o.fillAt !== undefined) tl.fromTo(prog, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: o.fillDur || 1.5, ease: "none" }, o.fillAt);
    if (o.label) S.text(o.label, cx, cy + 20, { size: r * 0.55, t: t + dur * 0.8, dur: dur * 0.2, parent: g });

  // pie chart: frac of the circle highlighted (big slice colour cBig, small slice cSmall)
  pie(S, cx, cy, r, frac, t, dur, o = {}) {
    const g = S.grp(o.parent), a1 = -90 + 360 * frac;
    const big = [[cx, cy], ...arcPts(cx, cy, r, -90, a1, 40), [cx, cy]];
    const small = [[cx, cy], ...arcPts(cx, cy, r, a1, 270, 12), [cx, cy]];
    S.draw(circ(cx, cy, r), t, dur * 0.4, { w: 7, parent: g });
    const pb = S.fill(poly(big, 0), t + dur * 0.4, dur * 0.3, o.cBig || GRAY, 0.55, g);
    const ps = S.fill(poly(small, 0), t + dur * 0.7, dur * 0.3, o.cSmall || RED, 0.85, g);

    S.seq([[rrect(x, y, w, h, 10), 2, { w: 7 }], [rect(x + w, y + h * 0.3, 14, h * 0.4), 0.4, { w: 6 }]], t, dur * 0.7, g);

  trophy(S, cx, y, s = 1, t, dur, o = {}) { // y = base bottom
    const g = S.grp(o.parent), top = y - 200 * s;
    S.seq([
      [smooth([[cx - 70 * s, top], [cx - 62 * s, top + 90 * s], [cx, top + 135 * s], [cx + 62 * s, top + 90 * s], [cx + 70 * s, top]]), 3, { w: 7, fill: YEL }],
      [line([cx - 74 * s, top], [cx + 74 * s, top], 1), 0.5, { w: 7 }],

      [poly([[cx, top + 135 * s], [cx, y - 28 * s], [cx - 38 * s, y], [cx + 38 * s, y], [cx, y - 28 * s]], 1), 1, { w: 6 }],
    ], t, dur, g);

  pedestal(S, x, y, w, h, t, dur, o = {}) { // x left, y floor
    const g = S.grp(o.parent);
    S.draw(rect(x, y - h, w, h), t, dur * (o.label ? 0.7 : 1), { w: 7, fill: CREAM, parent: g });
    if (o.label) S.text(o.label, x + w / 2, y - h / 2 + 16, { size: Math.min(48, h * 0.6), t: t + dur * 0.7, dur: dur * 0.3, parent: g });

  plant(S, x, y, s = 1, t, dur, o = {}) { // pot base centre (x,y)
    const g = S.grp(o.parent);
    S.seq([
      [poly([[x - 40 * s, y], [x - 50 * s, y - 60 * s], [x + 50 * s, y - 60 * s], [x + 40 * s, y], [x - 40 * s, y]], 1), 1, { w: 6, fill: "#e8b98d" }],
      [smooth([[x, y - 60 * s], [x - 3 * s, y - 110 * s], [x + 5 * s, y - 165 * s], [x, y - 210 * s]]), 1.5, { w: 7, c: GREEN }],
      [smooth([[x - 2 * s, y - 120 * s], [x - 50 * s, y - 135 * s], [x - 70 * s, y - 185 * s], [x - 25 * s, y - 165 * s], [x - 2 * s, y - 120 * s]]), 1, { w: 6, c: GREEN, fill: LEAF }],
      [smooth([[x + 2 * s, y - 165 * s], [x + 50 * s, y - 185 * s], [x + 70 * s, y - 235 * s], [x + 25 * s, y - 215 * s], [x + 2 * s, y - 165 * s]]), 1, { w: 6, c: GREEN, fill: LEAF }],
    ], t, dur, g);
    return { g };
  },
  book(S, cx, cy, s = 1, t, dur, o = {}) { // open book centred
    const g = S.grp(o.parent), k = s;
    S.seq([
      [poly([[cx - 240 * k, cy - 70 * k], [cx, cy - 35 * k], [cx, cy + 100 * k], [cx - 240 * k, cy + 65 * k], [cx - 240 * k, cy - 70 * k]], 2), 2, { w: 7, fill: CREAM }],
      [poly([[cx, cy - 35 * k], [cx + 240 * k, cy - 70 * k], [cx + 240 * k, cy + 65 * k], [cx, cy + 100 * k]], 2), 2, { w: 7, fill: CREAM }],
      [[-1, 1].map((sd) => [0, 1, 2].map((i) => poly([[cx + sd * 35 * k, cy - 12 * k + i * 32 * k], [cx + sd * 205 * k, cy - 34 * k + i * 32 * k]], 1)).join("")).join(""), 2, { w: 3.5 }],
    ], t, dur, g);

  underline(S, x1, x2, y, t, dur, o = {}) { return { g: S.draw(poly([[x1, y], [(x1 + x2) / 2, y + 6], [x2, y - 3]], 2), t, dur, { w: o.w || 12, c: o.c || INK, parent: o.parent }) }; },
  // circle highlight around something
  ring(S, cx, cy, rx, ry, t, dur, o = {}) { return { g: S.draw(circ(cx, cy, rx, ry), t, dur, { w: o.w || 7, c: o.c || RED, parent: o.parent }) }; },
  // n small people in a row; o.hi = indices drawn in colour o.hiC; returns figs
  crowd(S, n, x0, gy, gap, s, t, dur, o = {}) {
    const figs = [];
    for (let i = 0; i < n; i++) {
      const hi = (o.hi || []).includes(i);
      const F = fig(S, x0 + i * gap, gy, { s, c: hi ? o.hiC || RED : o.c || INK, parent: o.parent, pose: o.pose });
      F.draw(t + (i * dur * 0.5) / n, dur * 0.5);
      if (o.face) F.face(t + dur * 0.9, hi && o.hiFace ? o.hiFace : o.face);
      figs.push(F);
    }
    return figs;
  },
  hamsterWheel(S, cx, cy, r, t, dur, o = {}) {
    const g = S.grp(o.parent), wheel = S.grp(g);
    S.draw(circ(cx, cy, r), t, dur * 0.5, { w: 8, parent: wheel });
    S.draw(rays(cx, cy, 8, r, 8, 0), t + dur * 0.5, dur * 0.25, { w: 4, parent: wheel });
    S.draw(poly([[cx, cy], [cx - r * 0.55, cy + r * 1.25]], 1) + poly([[cx, cy], [cx + r * 0.55, cy + r * 1.25]], 1) + poly([[cx - r * 0.75, cy + r * 1.25], [cx + r * 0.75, cy + r * 1.25]], 1), t + dur * 0.75, dur * 0.25, { w: 7, parent: g });
    return { g, wheel, spin: (t0, d, turns = 2) => tl.to(wheel, { rotation: 360 * turns, svgOrigin: `${cx} ${cy}`, duration: d, ease: "none" }, t0) };
  },
  flame(S, cx, cy, s = 1, t, dur, o = {}) { // cy = base
    const g = S.grp(o.parent);
    S.draw(smooth([[cx - 40 * s, cy], [cx - 55 * s, cy - 60 * s], [cx - 15 * s, cy - 110 * s], [cx, cy - 160 * s], [cx + 10 * s, cy - 100 * s], [cx + 45 * s, cy - 80 * s], [cx + 42 * s, cy - 20 * s], [cx, cy + 2 * s], [cx - 40 * s, cy]]), t, dur * 0.7, { w: 6, fill: ORANGE, parent: g });
    S.draw(smooth([[cx - 15 * s, cy - 5 * s], [cx - 22 * s, cy - 40 * s], [cx, cy - 75 * s], [cx + 18 * s, cy - 35 * s], [cx + 10 * s, cy - 5 * s]]), t + dur * 0.7, dur * 0.3, { w: 4, fill: YEL, parent: g });
    return { g };
  },
  drop(S, cx, cy, s = 1, t, dur = 0.2, o = {}) { return { g: S.draw(smooth([[cx, cy - 22 * s], [cx - 10 * s, cy], [cx - 9 * s, cy + 10 * s], [cx, cy + 15 * s], [cx + 9 * s, cy + 10 * s], [cx + 10 * s, cy], [cx, cy - 22 * s]]), t, dur, { w: 4, c: BLUE, fill: o.fill || SKY, parent: o.parent }) }; },
  bolt(S, cx, cy, s = 1, t, dur = 0.25, o = {}) { return { g: S.draw(poly([[cx + 20 * s, cy - 70 * s], [cx - 25 * s, cy + 5 * s], [cx + 8 * s, cy + 5 * s], [cx - 18 * s, cy + 75 * s], [cx + 32 * s, cy - 10 * s], [cx, cy - 10 * s], [cx + 20 * s, cy - 70 * s]], 1), t, dur, { w: 5, fill: YEL, parent: o.parent }) }; },
  zzz(S, x, y, t, dur, o = {}) { const g = S.grp(o.parent); ["z", "z", "Z"].forEach((z, i) => S.text(z, x + i * 30, y - i * 34, { size: 40 + i * 12, t: t + (i * dur) / 3, dur: dur / 3, parent: g, c: o.c || INK })); return { g }; },
  // theatre seats row
  seats(S, x0, y, n, gap, t, dur, o = {}) {
    const g = S.grp(o.parent);
    let d = "";
    for (let i = 0; i < n; i++) { const x = x0 + i * gap; d += rrect(x, y - 110, gap * 0.8, 70, 14) + rect(x - 4, y - 46, gap * 0.8 + 8, 30); }
    S.draw(d, t, dur, { w: 5, parent: g, fill: o.fill || (DARK ? "#5a2f33" : "#e8a3a3") });
    return { g };
  },
  // graduation cap (o.kind:"grad") or Napoleon bicorne ("bicorne") centred at (cx,cy)
  hat(S, cx, cy, s = 1, t, dur, o = {}) {
    const g = S.grp(o.parent);
    if ((o.kind || "grad") === "grad") S.seq([[poly([[cx - 70 * s, cy], [cx, cy - 30 * s], [cx + 70 * s, cy], [cx, cy + 30 * s], [cx - 70 * s, cy]], 1), 2, { w: 6, fill: INK }], [rect(cx - 36 * s, cy + 10 * s, 72 * s, 30 * s), 1, { w: 6, fill: INK }], [smooth([[cx, cy], [cx + 50 * s, cy + 12 * s], [cx + 58 * s, cy + 52 * s]]), 0.6, { w: 4, c: YEL }]], t, dur, g);
    else S.seq([[smooth([[cx - 95 * s, cy + 20 * s], [cx - 60 * s, cy - 30 * s], [cx, cy - 55 * s], [cx + 60 * s, cy - 30 * s], [cx + 95 * s, cy + 20 * s], [cx, cy + 8 * s], [cx - 95 * s, cy + 20 * s]]), 2, { w: 6, fill: INK }], [circ(cx, cy - 22 * s, 11 * s), 0.6, { w: 4, fill: RED }]], t, dur, g);
    return { g };
  },
  // name tag / label box with text
  tag(S, cx, cy, txt, t, dur, o = {}) {
    const g = S.grp(o.parent), size = o.size || 40, w = txt.length * size * 0.55 + 40, h = size * 1.4;
    S.draw(rrect(cx - w / 2, cy - h / 2, w, h, 10), t, dur * 0.4, { w: 5, fill: o.fill || PAPER, parent: g, c: o.c || INK });
    S.text(txt, cx, cy + size * 0.35, { size, t: t + dur * 0.4, dur: dur * 0.6, parent: g, c: o.tc || INK });
    return { g };
  },
  // checklist: items [text,...] from (x,y) downwards; returns box centres
  checklist(S, x, y, items, t, dur, o = {}) {
    const g = S.grp(o.parent), gap = o.gap || 78, size = o.size || 48, boxes = [];
    items.forEach((txt, i) => {
      const yy = y + i * gap, tt = t + (i * dur) / items.length, d = dur / items.length;
      S.draw(rect(x, yy - 24, 46, 46), tt, d * 0.35, { w: 6, parent: g });
      S.text(txt, x + 70, yy + 16, { size, anchor: "start", t: tt + d * 0.35, dur: d * 0.6, parent: g });
      boxes.push([x + 23, yy]);
    });
    return { g, boxes };
  },
  // glowing rays burst
  burst(S, cx, cy, r1, r2, n, t, dur, o = {}) { return { g: S.draw(rays(cx, cy, r1, r2, n, o.a0 || 0, o.span || Math.PI * 2), t, dur, { w: o.w || 6, c: o.c || INK, parent: o.parent }) }; },
};

// ---------- captions (bottom line, word-by-word reveal) ----------
function captions(CH) {
  const capsEl = document.getElementById("caps");
  CH.forEach((ch, i) => {
    const ws = ch.slice(0, -1), clipEnd = ch[ch.length - 1];
    const d = document.createElement("div");
    d.className = "cap";
    ws.forEach((w) => {
      const sp = document.createElement("span");
      sp.textContent = w[0];
      d.appendChild(sp);
      tl.to(sp, { opacity: 1, duration: 0.08 }, w[1]);
    });
    capsEl.appendChild(d);
    const t0 = ws[0][1] - 0.05, nxt = CH[i + 1];
    const t1 = nxt && nxt[0][1] - ws[ws.length - 1][2] < 1.2 ? nxt[0][1] - 0.05 : clipEnd + 0.4;
    tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
    tl.to(d, { opacity: 0, duration: 0.2 }, Math.min(t1, TOTAL) - 0.2);
  });
}
